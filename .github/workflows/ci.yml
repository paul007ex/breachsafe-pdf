name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    container:
      # v0.1.0 was never published. breachsafe-golden-go ships latest, 1.26.6 and 1.26,
      # and GHCR answers "denied" for a missing tag on a public package, which reads as
      # an auth failure and is not one. Every run of this workflow has failed on that.
      # Series tag, so a 1.26.6 -> 1.26.7 bump needs no edit here.
      image: ghcr.io/paul007ex/breachsafe-golden-go:1.26
      # breachsafe-golden-go ships USER 65532:65532 for defence in depth. The Actions
      # runner owns /__w and /__w/_temp as uid 1001, so a uid-65532 container cannot
      # write the runner file commands and every step dies with EACCES on
      # _runner_file_commands/save_state_*. Run the ephemeral CI container as root;
      # the non-root default still applies to the published image and the devcontainer.
      # Same fix breachsafe-golden-python already carries in quality-gates-python.yml.
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain doctor
        run: golden-go-doctor
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          set -o pipefail
          go test -json ./... | tee /tmp/go-test.json
          test "$(jq -s '[.[] | select(.Action == "skip" and .Test != null)] | length' /tmp/go-test.json)" -eq 0
      - name: Race test
        run: go test -race ./...
      - name: Module verification
        run: go mod verify
      - name: Staticcheck
        run: staticcheck ./...
      - name: Golangci-lint
        run: golangci-lint run
      # Gosec is present in the shared toolchain. Make it a required gate after
      # the inherited prototype's path/error findings are remediated; do not
      # hide those findings with exclusions.
      - name: Govulncheck
        run: govulncheck ./...
      - name: OSV scan
        run: osv-scanner scan source -r .
      - name: Diff check
        run: git diff --check
