version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - ineffassign
    - nilerr
    - revive
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        # These are JSON wire-model and layout structs. Field reordering would
        # obscure schema order for marginal heap savings and does not change
        # serialized output; memory limits are enforced at admission instead.
        - fieldalignment
  exclusions:
    generated: lax
